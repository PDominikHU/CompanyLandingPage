<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Egyedi webfejlesztés és modern webdesign profiktól. Gyors, keresőoptimalizált weboldalak készítése garanciával. Kattintson és növelje üzleti bevételét velünk!"
		/>
		<script>
			// Prevent FOUC (Flash of Unstyled Content) for Dark Mode
			(function () {
				try {
					const localTheme = localStorage.getItem('theme');
					const supportDarkMode =
						window.matchMedia('(prefers-color-scheme: dark)').matches === true;

					if (!localTheme && supportDarkMode) {
						document.documentElement.classList.add('dark');
					}

					if (localTheme === 'dark') {
						document.documentElement.classList.add('dark');
					}
				} catch (e) {
					// Fail silently
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
